<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Plugg — Launch Video</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0d0e14;
        --surface: #161822;
        --ink: #fafafa;
        --ink-muted: #9da4b4;
        --border: rgba(255, 255, 255, 0.09);
        --font-display: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-sans);
        color: var(--ink);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1: The Genesis Hook (0.0s - 4.5s) -->
      <div
        id="scene-hook"
        data-composition-id="scene-hook"
        data-composition-src="compositions/scene-hook.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 2: The Web Player Showcase (4.5s - 9.5s) -->
      <div
        id="scene-player"
        data-composition-id="scene-player"
        data-composition-src="compositions/scene-player.html"
        data-start="4.5"
        data-duration="5.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 3: Direct Artist Distribution & Telemetry (9.5s - 15.0s) -->
      <div
        id="scene-telemetry"
        data-composition-id="scene-telemetry"
        data-composition-src="compositions/scene-telemetry.html"
        data-start="9.5"
        data-duration="5.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 4: Climax & Outro (15.0s - 20.0s) -->
      <div
        id="scene-outro"
        data-composition-id="scene-outro"
        data-composition-src="compositions/scene-outro.html"
        data-start="15.0"
        data-duration="5.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Audio Layer: Sonet - Forever soundtrack -->
      <audio
        id="bg-music"
        data-start="0"
        data-duration="20"
        data-track-index="10"
        data-volume="0.45"
        data-fade-out="1.5"
        src="assets/music/forever-by-sonet.mp3"
      ></audio>

      <!-- SFX: Scene 1 Atmospheric Impact -->
      <audio
        id="sfx-impact-1"
        data-start="0.5"
        data-duration="0.2"
        data-track-index="11"
        data-volume="0.4"
        src="assets/sfx/impact/impactSoft_medium_001.ogg"
      ></audio>

      <!-- SFX: Scene 2 Play Action Tap -->
      <audio
        id="sfx-click"
        data-start="5.8"
        data-duration="0.1"
        data-track-index="11"
        data-volume="0.6"
        src="assets/sfx/ui/mouseclick1.ogg"
      ></audio>

      <!-- SFX: Scene 3 Beat-Grid Telemetry Drops -->
      <audio
        id="sfx-card-1"
        data-start="11.15"
        data-duration="0.15"
        data-track-index="11"
        data-volume="0.4"
        src="assets/sfx/interface/drop_001.ogg"
      ></audio>

      <audio
        id="sfx-card-2"
        data-start="12.21"
        data-duration="0.15"
        data-track-index="11"
        data-volume="0.4"
        src="assets/sfx/interface/drop_001.ogg"
      ></audio>

      <audio
        id="sfx-card-3"
        data-start="13.27"
        data-duration="0.15"
        data-track-index="11"
        data-volume="0.4"
        src="assets/sfx/interface/drop_001.ogg"
      ></audio>

      <!-- SFX: Scene 4 Final Brand Bell Hit -->
      <audio
        id="sfx-bell"
        data-start="17.5"
        data-duration="1.5"
        data-track-index="11"
        data-volume="0.55"
        src="assets/sfx/impact/impactBell_heavy_000.ogg"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const mainTimeline = gsap.timeline({ paused: true });
      window.__timelines["main"] = mainTimeline;
      mainTimeline.seek(0);
    </script>
  </body>
</html>
