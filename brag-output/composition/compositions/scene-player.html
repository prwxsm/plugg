  <script>
    window.__timelines = window.__timelines || {};
    const tlPlayer = gsap.timeline({ paused: true });

    // Header & Main container entrance
    tlPlayer.fromTo(
      "#player-header-node",
      { opacity: 0, y: -20 },
      { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
      0.1
    );

    // Album art dramatic 3D push-in
    tlPlayer.fromTo(
      "#album-art-box",
      { opacity: 0, scale: 0.9, y: 30 },
      { opacity: 1, scale: 1, y: 0, duration: 0.9, ease: "power4.out" },
      0.2
    );

    // Album text arrival
    tlPlayer.fromTo(
      "#album-text-box",
      { opacity: 0, x: 30 },
      { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" },
      0.35
    );

    // Bottom floating player bar entry
    tlPlayer.fromTo(
      "#bottom-bar-node",
      { opacity: 0, y: 40 },
      { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
      0.5
    );

    // Interactive button press action at 1.3s (global 5.8s)
    tlPlayer.to(
      "#player-btn-circle",
      { scale: 0.92, duration: 0.1, ease: "power2.inOut" },
      1.3
    );
    tlPlayer.to(
      "#player-btn-circle",
      { scale: 1.05, duration: 0.25, ease: "elastic.out(1.2, 0.4)" },
      1.4
    );

    // Button pulse ring expanding on click
    tlPlayer.fromTo(
      "#play-pulse-ring",
      { opacity: 0.9, scale: 1 },
      { opacity: 0, scale: 1.8, duration: 0.6, ease: "power2.out" },
      1.35
    );

    // Progress bar fills forward smoothly
    tlPlayer.fromTo(
      "#progress-bar-inner",
      { width: "35%" },
      { width: "58%", duration: 3.5, ease: "none" },
      1.4
    );

    // Waveform bars dance
    const waveBars = document.querySelectorAll(".wave-bar");
    waveBars.forEach((bar, idx) => {
      const baseHeight = 10 + (idx % 5) * 4;
      tlPlayer.fromTo(
        bar,
        { height: baseHeight },
        {
          height: baseHeight + 14,
          duration: 0.35 + (idx % 3) * 0.1,
          repeat: 6,
          yoyo: true,
          ease: "sine.inOut",
        },
        1.4
      );
    });

    // Scene exit transition
    tlPlayer.to(
      ["#player-main-node", "#bottom-bar-node"],
      { opacity: 0, scale: 0.96, duration: 0.45, ease: "power2.in" },
      4.55
    );

    window.__timelines["scene-player"] = tlPlayer;
    tlPlayer.seek(0);
  </script>
