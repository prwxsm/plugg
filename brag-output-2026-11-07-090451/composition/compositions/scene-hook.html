  <script>
    window.__timelines = window.__timelines || {};
    const tlHook = gsap.timeline({ paused: true });

    // Ambient glow breathe

      "#hook-bg-glow",
      { opacity: 0.4, scale: 0.9 },
      { opacity: 1, scale: 1.1, duration: 2.5, ease: "power2.out" },
      0

    // Smartphone chassis entrance - visible at frame 0
    tlHook.fromTo(
      "#hook-phone",
      { opacity: 1, scale: 0.96, y: 15 },
      { opacity: 1, scale: 1.0, y: 0, duration: 0.7, ease: "power3.out" },
      0
    );

    // Pill badge - visible at frame 0
    tlHook.fromTo(
      "#hook-pill-badge",
      { opacity: 0.9, y: 0 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
      0
    );

    // Line 1: YOUR SOUND. (settled and readable right from frame 0)
    tlHook.fromTo(
      "#hook-line-1",
      { opacity: 0.95, y: 10, filter: "blur(0px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power4.out" },
      0
    );

    // Line 2: YOUR STREAM.
    tlHook.fromTo(
      "#hook-line-2",
      { opacity: 0, y: 35, filter: "blur(6px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power4.out" },

      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },

    // Audio Equalizer bars animation
    const heights = [60, 100, 45, 90, 115, 75, 110, 85, 100, 50, 115, 80, 65, 95];
    const bars = document.querySelectorAll(".v-bar");
    bars.forEach((b, i) => {
      tlHook.fromTo(
        b,
        { height: 16 },
        {
          height: heights[i % heights.length],
          duration: 0.5,
          repeat: 6,
          yoyo: true,
          ease: "power1.inOut"
        },
        0.3 + (i * 0.05)
      );
    });

      "#hook-phone",
      { scale: 1.35, opacity: 0, duration: 0.4, ease: "power3.in" },
