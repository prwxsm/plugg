  <script>
    window.__timelines = window.__timelines || {};
    const tlPlayer = gsap.timeline({ paused: true });

    // Header bar entrance
    tlPlayer.fromTo(
      "#player-header-bar",
      { opacity: 0, y: -20 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
      0
    );

    // Artwork & Track meta entrance
    tlPlayer.fromTo(
      "#player-showcase-box",
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
      0.1
    );

    // Audio & Controls entrance
    tlPlayer.fromTo(
      ["#player-audio-box", "#player-controls-box", "#mobile-nav-bar"],
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.6, stagger: 0.1, ease: "power3.out" },
      0.3
    );

    // Interactive Tap on Play Button at 1.2s local (= 5.4s film time)
    tlPlayer.fromTo(
      "#btn-play-interactive",
      { scale: 1 },
      { scale: 0.9, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.inOut" },
      1.2
    );

    tlPlayer.fromTo(
      "#tap-ring",
      { opacity: 0.9, scale: 1 },
      { opacity: 0, scale: 1.6, duration: 0.45, ease: "power2.out" },
      1.25
    );

    // Waveform dancing animation
    const waveHeights = [55, 68, 38, 70, 60, 48, 65, 50, 68, 42, 60, 52, 65, 45, 58, 64];
    const waveBars = document.querySelectorAll(".wave-bar");
    waveBars.forEach((b, i) => {
      tlPlayer.fromTo(
        b,
        { height: 16 },
        {
          height: waveHeights[i % waveHeights.length],
          duration: 0.35,
          repeat: 10,
          yoyo: true,
          ease: "power1.inOut"
        },
        0.5 + (i * 0.04)
      );
    });

    // Scrubber forward progress using transform x and scaleX for sub-pixel smoothness
    tlPlayer.fromTo(
      "#scrubber-fill",
      { scaleX: 1 },
      { scaleX: 1.55, duration: 3.2, ease: "none" },
      1.3
    );
    tlPlayer.fromTo(
      "#scrubber-dot",
      { x: 0 },
      { x: 215, duration: 3.2, ease: "none" },
      1.3
    );

    // Outro transition on elements rather than #root
    tlPlayer.to(
      ["#player-header-bar", "#player-showcase-box", "#player-audio-box", "#player-controls-box", "#mobile-nav-bar"],
      { opacity: 0, y: -40, duration: 0.4, stagger: 0.05, ease: "power2.in" },
      4.5
    );

    window.__timelines["scene-player"] = tlPlayer;
    tlPlayer.seek(0);
  </script>
